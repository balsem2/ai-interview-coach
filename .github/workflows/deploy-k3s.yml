name: Deploy to K3s

on:
  workflow_run:
    workflows:
      - Build and Push Docker Images
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy application to K3s with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/03-deploy-app.yml

      - name: Restart backend and frontend
        run: |
          ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl rollout restart deployment/backend deployment/frontend -n ai-interview" --become

      - name: Show pods
        run: |
          ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl get pods -n ai-interview" --become