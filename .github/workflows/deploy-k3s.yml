name: Deploy to K3s

on:
  workflow_run:
    workflows:
      - Build and Push Docker Images
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy application to K3s with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/03-deploy-app.yml

      - name: Deploy immutable image versions
        run: |
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl set image deployment/backend backend=ghcr.io/balsem2/ai-interview-backend:$IMAGE_TAG -n ai-interview" --become
          ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl set image deployment/frontend frontend=ghcr.io/balsem2/ai-interview-frontend:$IMAGE_TAG -n ai-interview" --become

      - name: Verify rollout or rollback
        run: |
          if ! ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl rollout status deployment/backend -n ai-interview --timeout=180s && kubectl rollout status deployment/frontend -n ai-interview --timeout=180s" --become; then
            ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl rollout undo deployment/backend -n ai-interview && kubectl rollout undo deployment/frontend -n ai-interview" --become
            exit 1
          fi

      - name: Show pods
        run: |
          ansible k3s_servers -i ansible/inventory.ini -m shell -a "kubectl get pods -n ai-interview" --become
