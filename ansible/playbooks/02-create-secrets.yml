---
- name: Create Kubernetes secrets for AI Interview
  hosts: k3s_servers
  become: true

  vars_prompt:
    - name: postgres_user
      prompt: "Postgres username"
      default: "postgres"
      private: false

    - name: postgres_password
      prompt: "Postgres password"
      default: "postgres"
      private: true

    - name: postgres_db
      prompt: "Postgres database name"
      default: "ai_interview_db"
      private: false

    - name: backend_secret_key
      prompt: "Backend SECRET_KEY"
      default: "change-this-secret-key-for-production"
      private: true

    - name: ghcr_username
      prompt: "GitHub username for GHCR (leave empty if images are public)"
      default: ""
      private: false

    - name: ghcr_token
      prompt: "GitHub token for GHCR (leave empty if images are public)"
      default: ""
      private: true

  tasks:
    - name: Ensure application namespace exists
      shell: kubectl create namespace ai-interview --dry-run=client -o yaml | kubectl apply -f -

    - name: Write Kubernetes secrets manifest
      copy:
        dest: /tmp/ai-interview-secrets.yml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secret
            namespace: ai-interview
          type: Opaque
          stringData:
            POSTGRES_USER: {{ postgres_user | to_json }}
            POSTGRES_PASSWORD: {{ postgres_password | to_json }}
            POSTGRES_DB: {{ postgres_db | to_json }}
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: backend-secret
            namespace: ai-interview
          type: Opaque
          stringData:
            DATABASE_URL: {{ ('postgresql://' ~ postgres_user ~ ':' ~ postgres_password ~ '@postgres:5432/' ~ postgres_db) | to_json }}
            SECRET_KEY: {{ backend_secret_key | to_json }}
      no_log: true

    - name: Apply Kubernetes secrets
      shell: kubectl apply -f /tmp/ai-interview-secrets.yml
      no_log: true

    - name: Remove temporary secrets manifest
      file:
        path: /tmp/ai-interview-secrets.yml
        state: absent
      no_log: true

    - name: Create GitHub Container Registry pull secret when token is provided
      shell: >
        kubectl create secret docker-registry ghcr-secret
        -n ai-interview
        --docker-server=ghcr.io
        --docker-username={{ ghcr_username | quote }}
        --docker-password={{ ghcr_token | quote }}
        --docker-email={{ (ghcr_username ~ '@users.noreply.github.com') | quote }}
        --dry-run=client -o yaml | kubectl apply -f -
      when: ghcr_username | length > 0 and ghcr_token | length > 0
      no_log: true

    - name: Attach GHCR pull secret to default service account when token is provided
      shell: kubectl patch serviceaccount default -n ai-interview -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}'
      when: ghcr_username | length > 0 and ghcr_token | length > 0
